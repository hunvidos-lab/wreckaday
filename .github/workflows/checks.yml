name: Payback reference-photo preview quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: pnpm --filter mobile exec expo install --check
      - run: pnpm --filter mobile exec expo export --platform all
      - run: pnpm exec playwright install --with-deps chromium
      - name: Photo-and-premise browser flow (mocked generation)
        run: |
          python scripts/serve-web.py > /tmp/wreckaday-web.log 2>&1 &
          node scripts/browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payback-browser-evidence
          path: work/browser
  generation-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wreckday
          POSTGRES_PASSWORD: local-only
          POSTGRES_DB: wreckday_budget_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U wreckday"
          --health-interval 3s --health-retries 20
    env:
      WRECKDAY_TEST_LEDGER_DATABASE_URL: postgresql+psycopg://wreckday:local-only@localhost:55432/wreckday_budget_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.lock
      - run: pip install -r services/api/requirements.lock
      - run: ruff check services/api && ruff format --check services/api
      - working-directory: services/api
        run: pytest -q
