# Optional trusted-development generation API. No database or media volume.
services:
  api:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile
      secrets: [proxy_ca]
    env_file:
      - path: .env
        required: false
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports: ["127.0.0.1:8000:8000"]
secrets:
  proxy_ca:
    file: ${CODEX_PROXY_CERT:-/etc/ssl/certs/ca-certificates.crt}
